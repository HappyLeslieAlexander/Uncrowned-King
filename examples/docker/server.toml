# Docker-oriented server example.
#
# Paths are relative to this directory inside /etc/uncrowned-king. Mount the
# whole directory read-only and run the container as the file owner (see
# README.md) because uk-server requires config/key files to be mode 0600.

listen = "0.0.0.0:9443"
quic_listen = "0.0.0.0:9443"
# The unauthenticated probe listener stays on loopback inside the container.
# Use `docker exec`/a sidecar to scrape it; do not publish it.
observability_listen = "127.0.0.1:9090"
cert_path = "/etc/uncrowned-king/server-cert.pem"
key_path = "/etc/uncrowned-king/server-key.pem"
policy_path = "/etc/uncrowned-king/policy.toml"
auth_skew_seconds = 30

[limits]
max_pre_auth_bytes = 4096
max_frame_size = 65536
max_sessions = 256
max_handshakes = 256
max_streams = 64
max_udp_flows = 64
max_outbound_dials_per_session = 16
max_buffered_bytes_per_session = 16777216
max_total_streams = 65536
max_total_buffered_bytes = 536870912
idle_timeout_seconds = 300
max_buffered_bytes_per_flow = 2097152
handshake_timeout_seconds = 10
target_connect_timeout_seconds = 10
tcp_half_close_timeout_seconds = 30
carrier_write_timeout_seconds = 30
tcp_keepalive_seconds = 60
udp_flow_idle_timeout_seconds = 120
shutdown_timeout_seconds = 30
replay_cache_window_seconds = 300
replay_cache_max_entries = 65536

[[credentials]]
key_id = "docker-demo"
# CHANGE THIS before exposing the container anywhere.
secret = "replace-with-a-long-random-shared-secret-0000000000000000"
status = "active"
policy_group = "default"
