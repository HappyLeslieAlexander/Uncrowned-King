---
# Source: uncrowned-king/templates/server-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-uncrowned-king-server-config
  labels:
    helm.sh/chart: uncrowned-king-0.1.2
    app.kubernetes.io/name: uncrowned-king
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
data:
  server.toml: |
    listen = "0.0.0.0:8443"
    observability_listen = "0.0.0.0:9090"
    cert_path = "/etc/uncrowned-king/tls/tls.crt"
    key_path = "/etc/uncrowned-king/tls/tls.key"
    policy_path = "/etc/uncrowned-king/policy/policy.toml"

    [limits]
    max_frame_size = 65536
    max_sessions = 10000
    max_handshakes = 1000
    max_streams = 1024
    max_udp_flows = 512
    max_buffered_bytes_per_session = 6.7108864e+07
    max_buffered_bytes_per_flow = 4.194304e+06
    relay_buffer_size = 16384
    auth_rate_limit_failures = 5
    auth_rate_limit_window_seconds = 60
    auth_rate_limit_ban_seconds = 300

  policy.toml: |
    default_action = "deny"
    [[rules]]
    action = "allow"
    policy_group = "default"
    cidr = "0.0.0.0/0"
    port_start = 1
    port_end = 65535
---
# Source: uncrowned-king/templates/server-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: audit-uncrowned-king-server
  labels:
    helm.sh/chart: uncrowned-king-0.1.2
    app.kubernetes.io/name: uncrowned-king
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
spec:
  type: LoadBalancer
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: tls
    - port: 443
      targetPort: 8443
      protocol: UDP
      name: quic
  selector:
    app.kubernetes.io/name: uncrowned-king
    app.kubernetes.io/instance: audit
    app.kubernetes.io/component: server
---
