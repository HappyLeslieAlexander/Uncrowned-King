{{- if .Values.server.enabled }}
{{- if not .Values.server.existingTlsSecret }}
{{- fail "Security error: server.existingTlsSecret must be set to a Kubernetes Secret containing tls.crt and tls.key" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uncrowned-king.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        {{- if not .Values.server.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/server-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "uncrowned-king.server.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 40
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-config
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /etc/uncrowned-king/policy
              cat /staging/config/server.toml /staging/credentials/credentials.toml > /etc/uncrowned-king/server.toml
              cp /staging/config/policy.toml /etc/uncrowned-king/policy/policy.toml
              case "${POD_IP}" in *:*) POD_HOST="[${POD_IP}]" ;; *) POD_HOST="${POD_IP}" ;; esac
              sed -i "s/__POD_IP__/${POD_HOST}/g" /etc/uncrowned-king/server.toml
              {{- if .Values.server.existingTlsSecret }}
              if [ -d /staging/tls ]; then
                mkdir -p /etc/uncrowned-king/tls
                cp /staging/tls/* /etc/uncrowned-king/tls/
                chmod 0600 /etc/uncrowned-king/tls/*
              fi
              {{- end }}
              chmod 0600 /etc/uncrowned-king/server.toml /etc/uncrowned-king/policy/policy.toml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          volumeMounts:
            - name: config-source
              mountPath: /staging/config
              readOnly: true
            - name: credentials-source
              mountPath: /staging/credentials
              readOnly: true
            {{- if .Values.server.existingTlsSecret }}
            - name: tls-source
              mountPath: /staging/tls
              readOnly: true
            {{- end }}
            - name: runtime-config
              mountPath: /etc/uncrowned-king
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - "uk-server"
            - "serve"
            - "--config"
            - "/etc/uncrowned-king/server.toml"
            - "--log-format"
            - "{{ .Values.server.config.log_format }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tls
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 8443
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/uncrowned-king
              readOnly: true
      volumes:
        - name: config-source
          configMap:
            name: {{ include "uncrowned-king.server.fullname" . }}-config
        - name: credentials-source
          secret:
            secretName: {{ .Values.server.existingSecret | default (printf "%s-credentials" (include "uncrowned-king.server.fullname" .)) }}
            defaultMode: 0400
        - name: runtime-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.server.existingTlsSecret }}
        - name: tls-source
          secret:
            secretName: {{ .Values.server.existingTlsSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
