{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uncrowned-king.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "uncrowned-king.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - "uk-server"
            - "serve"
            - "--config"
            - "/etc/uncrowned-king/server.toml"
            - "--log-format"
            - "{{ .Values.server.config.log_format }}"
          ports:
            - name: tls
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 8443
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/uncrowned-king/server.toml
              subPath: server.toml
              readOnly: true
            - name: policy
              mountPath: /etc/uncrowned-king/policy/policy.toml
              subPath: policy.toml
              readOnly: true
            {{- if .Values.server.existingTlsSecret }}
            - name: tls
              mountPath: /etc/uncrowned-king/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uncrowned-king.server.fullname" . }}-config
        - name: policy
          configMap:
            name: {{ include "uncrowned-king.server.fullname" . }}-config
        {{- if .Values.server.existingTlsSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.server.existingTlsSecret }}
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
