{{- if and .Values.client.enabled (eq .Values.client.kind "DaemonSet") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "uncrowned-king.client.fullname" . }}
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  selector:
    matchLabels:
      {{- include "uncrowned-king.client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/client-configmap.yaml") . | sha256sum }}
        {{- if not .Values.client.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/client-secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "uncrowned-king.client.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: stage-config
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /etc/uncrowned-king
              cat /staging/config/client.toml /staging/credentials/credentials.toml > /etc/uncrowned-king/client.toml
              chmod 0600 /etc/uncrowned-king/client.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          volumeMounts:
            - name: config-source
              mountPath: /staging/config
              readOnly: true
            - name: credentials-source
              mountPath: /staging/credentials
              readOnly: true
            - name: runtime-config
              mountPath: /etc/uncrowned-king
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          command:
            - "uk-client"
            - "socks5"
            - "--config"
            - "/etc/uncrowned-king/client.toml"
            - "--listen"
            - "0.0.0.0:{{ .Values.client.socks5.port }}"
            - "--allow-non-loopback"
          ports:
            - name: socks5
              containerPort: {{ .Values.client.socks5.port }}
              hostPort: {{ .Values.client.socks5.hostPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.client.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/uncrowned-king
              readOnly: true
            {{- if .Values.client.existingCaSecret }}
            - name: ca
              mountPath: /etc/uncrowned-king/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config-source
          configMap:
            name: {{ include "uncrowned-king.client.fullname" . }}-config
        - name: credentials-source
          secret:
            secretName: {{ .Values.client.existingSecret | default (printf "%s-credentials" (include "uncrowned-king.client.fullname" .)) }}
            defaultMode: 0400
        - name: runtime-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.client.existingCaSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.client.existingCaSecret }}
        {{- end }}
{{- end }}
