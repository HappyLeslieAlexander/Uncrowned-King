{{- if and .Values.client.enabled (not .Values.client.existingSecret) }}
{{- if or (not .Values.client.config.secret) (hasPrefix "replace-with" .Values.client.config.secret) }}
{{- fail "Security error: placeholder or empty credential secret found in client.config.secret. You must configure a secure 64-character hex secret before deployment." }}
{{- end }}
{{- $clientKeyId := .Values.client.config.key_id | default .Values.client.config.id | default .Values.client.config.keyId }}
{{- if not $clientKeyId }}
{{- fail "Security error: client.config.key_id is required and cannot be empty when client.existingSecret is not set." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uncrowned-king.client.fullname" . }}-credentials
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
type: Opaque
stringData:
  credentials.toml: |
    key_id = "{{ $clientKeyId }}"
    secret = "{{ .Values.client.config.secret }}"
{{- end }}
