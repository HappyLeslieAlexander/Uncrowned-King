{{- if and .Values.client.enabled (eq .Values.client.kind "DaemonSet") (not .Values.client.existingSecret) }}
{{- if hasPrefix "replace-with" .Values.client.config.secret }}
{{- fail "Security error: placeholder credential secret found in client.config.secret. You must configure a secure 64-character hex secret before deployment." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uncrowned-king.client.fullname" . }}-credentials
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
type: Opaque
stringData:
  credentials.toml: |
    key_id = "{{ .Values.client.config.key_id | default .Values.client.config.id }}"
    secret = "{{ .Values.client.config.secret }}"
{{- end }}
