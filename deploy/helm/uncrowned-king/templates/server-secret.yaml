{{- if and .Values.server.enabled (not .Values.server.existingSecret) }}
{{- if empty .Values.server.credentials }}
{{- fail "Security error: server.credentials must not be empty when server.existingSecret is not set." }}
{{- end }}
{{- range .Values.server.credentials }}
{{- if or (not .secret) (hasPrefix "replace-with" .secret) (lt (len (toString .secret)) 32) }}
{{- fail "Security error: placeholder or empty credential secret found in server.credentials. You must configure a secure secret of at least 32 characters (64-character hex recommended) before deployment." }}
{{- end }}
{{- $keyId := .key_id | default .id | default .keyId }}
{{- if not $keyId }}
{{- fail "Security error: key_id (or id) is required and must not be empty for each entry in server.credentials." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}-credentials
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  credentials.toml: |
    {{- range .Values.server.credentials }}
    [[credentials]]
    key_id = "{{ .key_id | default .id | default .keyId }}"
    secret = "{{ .secret }}"
    {{- if .status }}
    status = "{{ .status }}"
    {{- end }}
    {{- if .not_before }}
    not_before = {{ .not_before }}
    {{- end }}
    {{- if .not_after }}
    not_after = {{ .not_after }}
    {{- end }}
    {{- if .policy_group }}
    policy_group = "{{ .policy_group }}"
    {{- end }}
    {{- end }}
{{- end }}
