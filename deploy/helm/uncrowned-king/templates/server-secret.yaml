{{- if and .Values.server.enabled (not .Values.server.existingSecret) }}
{{- range .Values.server.credentials }}
{{- if hasPrefix "replace-with" .secret }}
{{- fail "Security error: placeholder credential secret found in server.credentials. You must configure a secure 64-character hex secret before deployment." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}-credentials
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  credentials.toml: |
    {{- range .Values.server.credentials }}
    [[credentials]]
    key_id = "{{ .key_id | default .id }}"
    secret = "{{ .secret }}"
    {{- if .status }}
    status = "{{ .status }}"
    {{- end }}
    {{- if .not_before }}
    not_before = {{ .not_before }}
    {{- end }}
    {{- if .not_after }}
    not_after = {{ .not_after }}
    {{- end }}
    {{- if .policy_group }}
    policy_group = "{{ .policy_group }}"
    {{- end }}
    {{- end }}
{{- end }}
