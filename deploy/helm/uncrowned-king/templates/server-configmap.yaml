{{- if .Values.server.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}-config
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
data:
  server.toml: |
    listen = "{{ .Values.server.config.listen }}"
    {{- if .Values.server.config.observability_listen }}
    observability_listen = "{{ .Values.server.config.observability_listen }}"
    {{- end }}
    cert_path = "/etc/uncrowned-king/tls/tls.crt"
    key_path = "/etc/uncrowned-king/tls/tls.key"
    policy_path = "/etc/uncrowned-king/policy/policy.toml"

    [limits]
    max_frame_size = {{ .Values.server.config.limits.max_frame_size }}
    max_sessions = {{ .Values.server.config.limits.max_sessions }}
    max_handshakes = {{ .Values.server.config.limits.max_handshakes }}
    max_streams = {{ .Values.server.config.limits.max_streams }}
    max_udp_flows = {{ .Values.server.config.limits.max_udp_flows }}
    max_buffered_bytes_per_session = {{ .Values.server.config.limits.max_buffered_bytes_per_session }}
    max_buffered_bytes_per_flow = {{ .Values.server.config.limits.max_buffered_bytes_per_flow }}
    relay_buffer_size = {{ .Values.server.config.limits.relay_buffer_size }}
    auth_rate_limit_failures = {{ .Values.server.config.limits.auth_rate_limit_failures }}
    auth_rate_limit_window_seconds = {{ .Values.server.config.limits.auth_rate_limit_window_seconds }}
    auth_rate_limit_ban_seconds = {{ .Values.server.config.limits.auth_rate_limit_ban_seconds }}

  policy.toml: |
    default_action = "{{ .Values.server.policy.default_action }}"
    {{- range .Values.server.policy.rules }}
    [[rules]]
    action = "{{ .action }}"
    {{- if .policy_group }}
    policy_group = "{{ .policy_group }}"
    {{- end }}
    {{- if .cidr }}
    cidr = "{{ .cidr }}"
    {{- end }}
    {{- if .domain }}
    domain = "{{ .domain }}"
    {{- end }}
    {{- if .port_start }}
    port_start = {{ .port_start }}
    {{- end }}
    {{- if .port_end }}
    port_end = {{ .port_end }}
    {{- end }}
    {{- end }}
{{- end }}
