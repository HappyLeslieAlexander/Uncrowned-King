{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uncrowned-king.server.fullname" . }}
  labels:
    {{- include "uncrowned-king.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.ports.tls.port }}
      targetPort: {{ .Values.server.service.ports.tls.targetPort }}
      protocol: {{ .Values.server.service.ports.tls.protocol }}
      name: tls
    - port: {{ .Values.server.service.ports.quic.port }}
      targetPort: {{ .Values.server.service.ports.quic.targetPort }}
      protocol: {{ .Values.server.service.ports.quic.protocol }}
      name: quic
    - port: {{ .Values.server.service.ports.metrics.port }}
      targetPort: {{ .Values.server.service.ports.metrics.targetPort }}
      protocol: {{ .Values.server.service.ports.metrics.protocol }}
      name: metrics
  selector:
    {{- include "uncrowned-king.server.selectorLabels" . | nindent 4 }}
{{- end }}
