# Default values for uncrowned-king.

global:
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

# Server component configuration
server:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/happylesliealexander/uncrowned-king-server
    pullPolicy: IfNotPresent
    tag: "v1.0.2"

  service:
    type: LoadBalancer
    annotations: {}
    ports:
      tls:
        port: 443
        targetPort: 8443
        protocol: TCP
      quic:
        port: 443
        targetPort: 8443
        protocol: UDP

  metricsService:
    enabled: true
    port: 9090
    targetPort: 9090
    annotations: {}

  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  config:
    listen: "0.0.0.0:8443"
    quic_listen: "0.0.0.0:8443"
    observability_listen: "__POD_IP__:9090"
    log_format: "json"
    limits:
      max_frame_size: 65536
      # Sizing formula (keep under resources.limits.memory, 2GiB here):
      #   max_sessions * max_buffered_bytes_per_session + session overhead
      #     < memory limit
      # 200 sessions x 8MiB = 1.6GiB worst-case queued bytes, and
      # max_total_buffered_bytes below hard-caps the sum at 1GiB regardless.
      # Each authenticated session also costs TLS/QUIC state and sockets, so
      # do not raise max_sessions without raising the memory limit.
      max_sessions: 200
      max_handshakes: 1000
      max_streams: 1024
      max_udp_flows: 512
      max_buffered_bytes_per_session: 8388608  # 8MB
      max_buffered_bytes_per_flow: 4194304     # 4MB
      # Global budgets across all sessions. Keep max_total_buffered_bytes
      # below the pod memory limit: 1GiB here for a 2GiB pod.
      max_total_streams: 65536
      max_total_buffered_bytes: 1073741824     # 1GiB
      relay_buffer_size: 16384                 # 16KB; also caps UDP datagram
                                               # payloads (raise on BOTH server
                                               # and client for large UDP)
      auth_rate_limit_failures: 5
      auth_rate_limit_window_seconds: 60
      auth_rate_limit_ban_seconds: 300
      # Failure accounting aggregates IPv6 sources by /64 and every client
      # behind one NAT egress into a single bucket: 5 failures from ANY of
      # them bans them ALL for ban_seconds. List trusted sources here (CIDR
      # or bare IP) to exempt them from both counting and banning.
      auth_rate_limit_allowlist: []

  # Credentials for authenticating clients.
  # WARNING: You MUST replace the placeholder secret with a secure 64-character hex secret!
  # Helm deployment will fail closed if a placeholder secret is detected.
  credentials:
    - id: "client-default"
      secret: "replace-with-a-64-character-hex-secret-in-production-00000000000000"
      policy_group: "default"

  # Access policies
  # WARNING: Configure allowed destination CIDRs, domains, and ports according to your
  # environment. The default rule below denies private targets and allows example.com on port 443.
  policy:
    rules:
      - action: "deny"
        private: true
      - action: "allow"
        policy_group: "default"
        domain_suffix: ".example.com"
        port_start: 443
        port_end: 443

  # Existing TLS secret name containing tls.crt and tls.key (e.g. from cert-manager)
  existingTlsSecret: ""

  # Existing credentials secret name containing credentials.toml
  existingSecret: ""

# Client DaemonSet / Deployment component configuration
client:
  enabled: false # Set true to deploy client as cluster-wide sidecar / DaemonSet
  kind: DaemonSet # DaemonSet or Deployment
  replicaCount: 1 # Used when kind is Deployment

  image:
    repository: ghcr.io/happylesliealexander/uncrowned-king-client
    pullPolicy: IfNotPresent
    tag: "v1.0.2"

  socks5:
    port: 1080
    hostPort: null # Disabled by default to prevent exposing unauthenticated SOCKS5 to cluster nodes
    # "local" binds 127.0.0.1 inside the pod. "cluster" binds 0.0.0.0 and is
    # reachable only through the explicit ingress allow-list below.
    exposure: "local"
    # Used only when exposure=cluster. Empty means "pods in this release
    # namespace"; add namespace names to widen the allow-list deliberately.
    allowedNamespaces: []
    # Optional pod label selector within the allowed namespaces. Empty means
    # all pods in those namespaces.
    allowedPods: {}

  # Optional stable endpoint for the SOCKS listener. Enable together with
  # exposure=cluster when workloads need a Service DNS name.
  service:
    enabled: false
    type: ClusterIP
    annotations: {}

  metrics:
    port: 9091

  # PodDisruptionBudget for the client pods. Rendered for DaemonSet clients
  # and for Deployment clients with replicaCount >= 2 (a PDB on a single
  # replica would block every voluntary disruption).
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "200m"
      memory: 256Mi

  config:
    server_addr: "" # Defaults to internal server Service: <release>-uncrowned-king-server.<namespace>.svc.cluster.local:443
    server_name: "uk.example.com"
    observability_listen: "__POD_IP__:9091"
    key_id: "client-default"
    secret: "replace-with-a-64-character-hex-secret-in-production-00000000000000"
    relay_buffer_size: 16384

  existingCaSecret: ""

  # Existing credentials secret name containing credentials.toml
  existingSecret: ""

# Prometheus Operator ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}
  client:
    # Requires client.service.enabled (and therefore socks5.exposure=cluster).
    # A loopback-only client sidecar has no scrapable endpoint and keeps
    # this disabled.
    enabled: false

# NetworkPolicy restricting ingress and egress traffic
networkPolicy:
  enabled: false
  prometheusNamespace: ""
  # Namespace containing cluster DNS. Egress to port 53 is restricted to
  # this namespace instead of allowing every destination on port 53.
  dnsNamespace: "kube-system"
  # Extra CIDRs allowed for DNS egress (port 53 only). Clusters running
  # NodeLocal DNSCache answer from a link-local IP (e.g. 169.254.20.25/32 on
  # GKE) that is neither in the DNS namespace nor covered by the namespace
  # selector — without an entry here those clusters cannot resolve at all
  # while probes stay green. Keep empty unless the cluster uses such a DNS
  # topology.
  dnsIpBlocks: []

