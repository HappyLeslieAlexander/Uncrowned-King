# Uncrowned King client on Kubernetes.
#
# Before applying, replace every REPLACE_ME below with real values (base a
# secret on `kubectl create secret generic ... --dry-run=client -o yaml` in
# practice; never commit real secrets). Then:
#
#   kubectl apply -f deploy/kubernetes/uncrowned-king-client.yaml
#
# The image is built and pushed by .github/workflows/release.yml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uncrowned-king-client-config
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
data:
  client.toml: |
    server_addr = "uncrowned-king-server.uncrowned-king.svc.cluster.local:9443"
    server_name = "server.example.com"
    ca_cert_path = "/etc/uncrowned-king/ca.crt"
    observability_listen = "__POD_IP__:9091"
    relay_buffer_size = 16384
    handshake_timeout_seconds = 10
    socks_handshake_timeout_seconds = 10
    tcp_open_timeout_seconds = 10
    udp_flow_idle_timeout_seconds = 60
    shutdown_timeout_seconds = 30
    max_socks_connections = 500
---
apiVersion: v1
kind: Secret
metadata:
  name: uncrowned-king-client
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
type: Opaque
stringData:
  credentials.toml: |
    key_id = "REPLACE_ME_CLIENT_KEY_ID"
    secret = "REPLACE_ME_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
  ca.crt: |
    REPLACE_ME_WITH_PEM_CA_CERTIFICATE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncrowned-king-client
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: uncrowned-king-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uncrowned-king-client
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stage-config
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /etc/uncrowned-king
              cat /staging/config/client.toml /staging/secret/credentials.toml > /etc/uncrowned-king/client.toml
              cp /staging/secret/ca.crt /etc/uncrowned-king/ca.crt
              case "${POD_IP}" in *:*) POD_HOST="[${POD_IP}]" ;; *) POD_HOST="${POD_IP}" ;; esac
              sed -i "s/__POD_IP__/${POD_HOST}/g" /etc/uncrowned-king/client.toml
              chmod 0600 /etc/uncrowned-king/client.toml /etc/uncrowned-king/ca.crt
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          volumeMounts:
            - name: config-source
              mountPath: /staging/config
              readOnly: true
            - name: secret-source
              mountPath: /staging/secret
              readOnly: true
            - name: runtime-config
              mountPath: /etc/uncrowned-king
      containers:
        - name: uk-client
          image: ghcr.io/happylesliealexander/uncrowned-king-client:v1.0.2
          command:
            - "uk-client"
            - "socks5"
            - "--config"
            - "/etc/uncrowned-king/client.toml"
            - "--listen"
            - "0.0.0.0:1080"
            - "--allow-non-loopback"
          ports:
            - name: socks5
              containerPort: 1080
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/uncrowned-king
              readOnly: true
      volumes:
        - name: config-source
          configMap:
            name: uncrowned-king-client-config
        - name: secret-source
          secret:
            secretName: uncrowned-king-client
            defaultMode: 0400
        - name: runtime-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: uncrowned-king-client
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: uncrowned-king-client
  ports:
    - name: socks5
      port: 1080
      targetPort: socks5
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: uncrowned-king-client
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uncrowned-king-client
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uncrowned-king-client
  namespace: uncrowned-king
  labels:
    app.kubernetes.io/name: uncrowned-king-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uncrowned-king-client
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming SOCKS5 connections from within the cluster
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 1080
    # Allow metrics scraping from Prometheus / monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9091
  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound carrier connections to UK server
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: UDP
          port: 9443
