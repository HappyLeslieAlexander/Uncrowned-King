name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        toolchain:
          - 1.85.0
          - stable
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustup component add rustfmt clippy

      - name: Format Check
        run: cargo fmt --all --check

      - name: Workspace Check
        run: cargo check --workspace --locked

      - name: Run Tests
        run: cargo test --workspace --locked

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Doc Check
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Release Build
        if: matrix.toolchain == 'stable'
        run: cargo build --workspace --release --locked

  security-and-license:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check
